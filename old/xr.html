<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Limonera VR Tour</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
    <script src="https://unpkg.com/aframe-template-component@3.x.x/dist/aframe-template-component.min.js"></script>
    <script src="https://unpkg.com/aframe-layout-component@5.x.x/dist/aframe-layout-component.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.x.x/dist/aframe-event-set-component.min.js"></script>
    <script src="https://unpkg.com/aframe-proxy-event-component@2.1.0/dist/aframe-proxy-event-component.min.js"></script>
  </head>
  <body>
    <a-scene real-world-meshing renderer="antialias: true; colorManagement: true;">
      <a-entity environment></a-entity>
      <a-assets>
        <a-asset-item id="building" src="building.glb" progress></a-asset-item>
      </a-assets>

      <!-- Architecture Model -->
      <a-entity edit id="building" gltf-model="#building" position="-1 -0.7 0"></a-entity>

      <a-entity id="rig" movement-controls="fly: false; speed: 0.15" position="0 0 8">
        <a-entity camera position="0 1.4 0" look-controls></a-entity>
        <a-entity oculus-touch-controls="hand: left"></a-entity>
        <a-entity oculus-touch-controls="hand: right"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Limonera VR Tour</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <a-scene id="scene" renderer="antialias: true; colorManagement: true;">
      <a-entity environment></a-entity>
      <a-assets>
        <a-asset-item id="building" src="building.glb" progress></a-asset-item>
      </a-assets>
      <!-- Architecture Model -->
      <a-entity edit id="building" gltf-model="#building" position="-1 -0.7 0"></a-entity>
      <!-- Text -->
      <!-- <a-entity id="menu" text="value: Welcome to la limonera VR experience;" position="0 2 7"></a-entity>
      <a-entity text="font: mozillavr; value: Via stock font name." position="1 1 7"></a-entity>
      <a-entity text="font: https://cdn.aframe.io/fonts/mozillavr.fnt; value: Via URL." position="1 2 7"></a-entity> -->
      <!-- Player Rig with Thumbstick Movement & Teleport -->
      <a-entity id="rig" movement-controls="fly: true; speed: 0.15" position="0 0 8">
        <a-entity camera position="0 1.4 0" look-controls></a-entity>
        <a-entity id="left-con" oculus-touch-controls="hand: left"></a-entity>
        <a-entity id="right-con" oculus-touch-controls="hand: right"></a-entity>
      </a-entity>
    </a-scene>
  </body>
  <script
    defer
    crossorigin="anonymous"
    src="https://complete-kodiak-6901.clerk.accounts.dev/npm/@clerk/ui@1/dist/ui.browser.js"
    type="text/javascript"
  ></script>

  <script
    defer
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_Y29tcGxldGUta29kaWFrLTY5MDEuY2xlcmsuYWNjb3VudHMuZGV2JA"
    src="https://complete-kodiak-6901.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
    type="text/javascript"
  ></script>
<script>
  window.addEventListener('load', async function () {
    await Clerk.load({
      ui: { ClerkUI: window.__internal_ClerkUICtor },
    })

    if (Clerk.isSignedIn) {
      document.getElementById('scene').style.display = 'block'

      document.getElementById('app').innerHTML = `
        <div id="user-button"></div>
      `

      const userButtonDiv = document.getElementById('user-button')

      Clerk.mountUserButton(userButtonDiv)
      
    } else {
      document.getElementById('scene').style.display = 'none'
      document.getElementById('app').innerHTML = `
        <div id="waitlist"></div>
      `

      const waitlistDiv = document.getElementById('waitlist')

      Clerk.mountWaitlist(waitlistDiv)

    }
  })
</script>
</html>

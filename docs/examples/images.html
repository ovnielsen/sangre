<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>360&deg; Image Gallery</title>
    <meta name="description" content="360&deg; Image Gallery - A-Frame">
    <!-- If running this example without a local copy of A-Frame, replace this next line with:
    <script src="https://aframe.io/releases/<release_number>/aframe.min.js"></script>
    -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
      <script>
    delete AFRAME.components["grabbable"];
  </script>
    <script src="https://unpkg.com/aframe-template-component@3.x.x/dist/aframe-template-component.min.js"></script>
    <script src="https://unpkg.com/aframe-layout-component@5.x.x/dist/aframe-layout-component.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.x.x/dist/aframe-event-set-component.min.js"></script>
    <script
        src="https://unpkg.com/aframe-proxy-event-component@2.1.0/dist/aframe-proxy-event-component.min.js"></script>
    <script src="https://unpkg.com/super-hands@^3.0.6/dist/super-hands.min.js"></script>    <script
        src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.1.0/dist/aframe-physics-system.js"></script>
    <script src="https://unpkg.com/aframe-physics-extras/dist/aframe-physics-extras.min.js"></script>

    <!-- Image link template to be reused. -->
    <script id="link" type="text/html">
      <a-entity class="link"
        geometry="primitive: plane; height: 1; width: 1"
        material="shader: flat; src: ${thumb}"
        sound="on: click; src: #click-sound"
        event-set__mouseenter="scale: 1.2 1.2 1"
        event-set__mouseleave="scale: 1 1 1"
        event-set__click="_target: #image-360; _delay: 300; material.src: ${src}"
        proxy-event="event: click; to: #image-360; as: fade"></a-entity>
    </script>
</head>

<body>
    <a-scene physics
        webxr="requiredFeatures: hand-tracking; optionalFeatures: local-floor; referenceSpaceType: local-floor">
        <a-assets>
            <img id="city" crossorigin="anonymous"
                src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/city.jpg">
            <img id="city-thumb" crossorigin="anonymous"
                src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/thumb-city.jpg">
            <img id="cubes-thumb" crossorigin="anonymous"
                src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/thumb-cubes.jpg">
            <img id="sechelt-thumb" crossorigin="anonymous"
                src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/thumb-sechelt.jpg">
            <audio id="click-sound" crossorigin="anonymous"
                src="https://cdn.aframe.io/360-image-gallery-boilerplate/audio/click.ogg"></audio>
            <img id="cubes" crossorigin="anonymous"
                src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/cubes.jpg">
            <img id="sechelt" crossorigin="anonymous"
                src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/sechelt.jpg">
            <a-mixin id="all-interactions" hoverable grabbable stretchable draggable
                event-set__hoveron="_event: hover-start; material.opacity: 0.7; transparent: true"
                event-set__hoveroff="_event: hover-end; material.opacity: 1; transparent: false" dynamic-body></a-mixin>

            <a-mixin id="grab-move" hoverable grabbable draggable
                event-set__hoveron="_event: hover-start; material.opacity: 0.7; transparent: true"
                event-set__hoveroff="_event: hover-end; material.opacity: 1; transparent: false" dynamic-body></a-mixin>

            <a-mixin id="physics-hands" physics-collider phase-shift collision-filter="collisionForces: false"
                static-body="shape: sphere; sphereRadius: 0.02" super-hands="colliderEvent: collisions;
                              colliderEventProperty: els;
                              colliderEndEvent: collisions;
                              colliderEndEventProperty: clearedEls;"></a-mixin>
        </a-assets>

        <!-- 360-degree image. -->
        <a-sky id="image-360" radius="10" src="#city"
            animation__fade="property: components.material.material.color; type: color; from: #FFF; to: #000; dur: 300; startEvents: fade"
            animation__fadeback="property: components.material.material.color; type: color; from: #000; to: #FFF; dur: 300; startEvents: animationcomplete__fade"></a-sky>

        <!-- Image links. -->
        <a-entity id="links" layout="type: line; margin: 1.5" position="-1.5 -1 -4">
            <a-entity template="src: #link" data-src="#city" data-thumb="#city-thumb"></a-entity>
            <a-entity template="src: #link" data-src="#cubes" data-thumb="#cubes-thumb"></a-entity>
            <a-entity template="src: #link" data-src="#sechelt" data-thumb="#sechelt-thumb"></a-entity>
        </a-entity>

        <a-entity camera>
            <a-cursor id="cursor"
                animation__click="property: scale; startEvents: click; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150"
                animation__fusing="property: fusing; startEvents: fusing; from: 1 1 1; to: 0.1 0.1 0.1; dur: 1500"
                event-set__mouseenter="_event: mouseenter; color: springgreen"
                event-set__mouseleave="_event: mouseleave; color: black" raycaster="objects: .link; far: 10"></a-cursor>
        </a-entity>

        <a-entity  sphere-collider="objects: a-box" super-hands hand-controls="hand: left" raycaster="objects: .link; far: 10"
            line="color: white; opacity: 0.8"></a-entity>

        <a-entity sphere-collider="objects: a-box" super-hands hand-controls="hand: right" raycaster="objects: .link; far: 10"
            line="color: white; opacity: 0.8"></a-entity>
    </a-scene>

    <script>
        const cursor = document.getElementById('cursor');
        const scene = document.querySelector('a-scene');

        scene.addEventListener('enter-vr', function () {
            cursor.setAttribute('raycaster', 'objects: none');
            cursor.setAttribute('visible', false);
        });

        scene.addEventListener('exit-vr', function () {
            cursor.setAttribute('raycaster', 'objects: .link; far: 10');
            cursor.setAttribute('visible', true);
        });

        function changeSkyTo(target) {
            if (!target || !target.classList || !target.classList.contains('link')) return;
            const src = target.getAttribute('data-src');
            if (!src) return;
            const sky = document.querySelector('#image-360');
            if (sky) sky.setAttribute('material', 'src', src);
        }

        AFRAME.registerComponent('hand-laser-selector', {
            init: function () {
                this.el.addEventListener('triggerdown', () => {
                    const raycaster = this.el.components.raycaster;
                    const hit = raycaster && raycaster.intersectedEls && raycaster.intersectedEls[0];
                    if (hit) changeSkyTo(hit);
                });
            }
        });

        document.querySelectorAll('.link').forEach(function (panel) {
            panel.addEventListener('click', function () {
                changeSkyTo(panel);
            });
        });
    </script>
</body>

</html>

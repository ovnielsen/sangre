<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Limonera VR Tour - Wrist Palette with Save/Load</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>

    <script>
      // 1. Component to calculate bounding box and create a VISIBLE RED COLLIDER
      AFRAME.registerComponent('make-grabbable', {
        init: function () {
          const el = this.el;

          el.addEventListener('model-loaded', () => {
            const obj = el.getObject3D('mesh');
            if (!obj) return;

            // Compute the real bounding box of the GLTF model
            const bbox = new THREE.Box3().setFromObject(obj);
            const size = new THREE.Vector3();
            bbox.getSize(size);
            const center = new THREE.Vector3();
            bbox.getCenter(center);

            // Compute local center relative to root entity
            const worldPos = new THREE.Vector3();
            el.object3D.getWorldPosition(worldPos);
            const localCenter = center.clone().sub(worldPos);

            const w = Math.max(size.x * 1.05, 0.3);
            const h = Math.max(size.y * 1.05, 0.3);
            const d = Math.max(size.z * 1.05, 0.3);

            // Store collision radius for fast distance checking
            el.grabRadius = Math.max(w, h, d) / 1.5;

            // Remove existing collider if present
            const oldCollider = el.querySelector('.grab-collider');
            if (oldCollider) el.removeChild(oldCollider);

            // Add VISIBLE RED WIREFRAME & TRANSLUCENT COLLIDER BOX
            const collider = document.createElement('a-box');
            collider.classList.add('grab-collider');
            collider.setAttribute('width', w);
            collider.setAttribute('height', h);
            collider.setAttribute('depth', d);
            collider.setAttribute('position', `${localCenter.x} ${localCenter.y} ${localCenter.z}`);
            collider.setAttribute('material', 'color: #ff0000; wireframe: true; opacity: 0.8; transparent: true');

            // Inner translucent core so it is easy to spot in 3D
            const innerBox = document.createElement('a-box');
            innerBox.setAttribute('width', w * 0.98);
            innerBox.setAttribute('height', h * 0.98);
            innerBox.setAttribute('depth', d * 0.98);
            innerBox.setAttribute('material', 'color: #ff2222; opacity: 0.25; transparent: true');
            collider.appendChild(innerBox);

            el.appendChild(collider);
          });
        }
      });

      // 2. Native Robust VR Grabber: handles Grip button on Oculus Touch
      AFRAME.registerComponent('vr-grabber', {
        init: function () {
          this.grabbedEl = null;
          this.controllerWorldPos = new THREE.Vector3();
          this.itemWorldPos = new THREE.Vector3();

          // Squeeze Grip to pick up
          this.el.addEventListener('gripdown', () => {
            if (this.grabbedEl) return;

            const candidates = document.querySelectorAll('.grabbable-item');
            this.el.object3D.getWorldPosition(this.controllerWorldPos);

            let closest = null;
            let minDistance = 999;

            candidates.forEach((item) => {
              item.object3D.getWorldPosition(this.itemWorldPos);
              const dist = this.controllerWorldPos.distanceTo(this.itemWorldPos);
              const threshold = item.grabRadius || 0.6;

              if (dist <= threshold && dist < minDistance) {
                minDistance = dist;
                closest = item;
              }
            });

            if (closest) {
              this.grabbedEl = closest;
              // Highlight collider green when held
              const col = this.grabbedEl.querySelector('.grab-collider');
              if (col) col.setAttribute('material', 'color: #00ff00; wireframe: true; opacity: 1');

              // Attach to controller in Three.js hierarchy
              this.el.object3D.attach(this.grabbedEl.object3D);
            }
          });

          // Release Grip to drop
          this.el.addEventListener('gripup', () => {
            if (this.grabbedEl) {
              const scene = document.querySelector('a-scene');
              scene.object3D.attach(this.grabbedEl.object3D);

              // Reset collider color to red
              const col = this.grabbedEl.querySelector('.grab-collider');
              if (col) col.setAttribute('material', 'color: #ff0000; wireframe: true; opacity: 0.8');

              // Sync back position and rotation to A-Frame attributes for saving
              const pos = this.grabbedEl.object3D.position;
              const rot = this.grabbedEl.object3D.rotation;
              this.grabbedEl.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
              this.grabbedEl.setAttribute('rotation', `${THREE.MathUtils.radToDeg(rot.x)} ${THREE.MathUtils.radToDeg(rot.y)} ${THREE.MathUtils.radToDeg(rot.z)}`);

              this.grabbedEl = null;
            }
          });
        }
      });

      // 3. Persistence Engine
      const ScenePersistence = {
        STORAGE_KEY: 'limonera_vr_layout',

        instantiateModel: function (modelSrc, pos, rot, scale) {
          const scene = document.querySelector('a-scene');
          const el = document.createElement('a-entity');
          
          el.classList.add('persisted-instance', 'grabbable-item');
          el.setAttribute('gltf-model', modelSrc);
          el.setAttribute('position', pos);
          el.setAttribute('rotation', rot || '0 0 0');
          el.setAttribute('scale', scale || '1 1 1');
          el.setAttribute('make-grabbable', '');

          scene.appendChild(el);
          return el;
        },

        save: function () {
          const instances = document.querySelectorAll('.persisted-instance');
          const data = [];

          instances.forEach((el) => {
            const pos = el.getAttribute('position');
            const rot = el.getAttribute('rotation');
            const scale = el.getAttribute('scale');
            const model = el.getAttribute('gltf-model');

            data.push({
              model: model,
              position: { x: +pos.x.toFixed(3), y: +pos.y.toFixed(3), z: +pos.z.toFixed(3) },
              rotation: { x: +rot.x.toFixed(2), y: +rot.y.toFixed(2), z: +rot.z.toFixed(2) },
              scale: { x: +scale.x.toFixed(3), y: +scale.y.toFixed(3), z: +scale.z.toFixed(3) }
            });
          });

          localStorage.setItem(this.STORAGE_KEY, JSON.stringify(data));
          return data.length;
        },

        load: function () {
          const raw = localStorage.getItem(this.STORAGE_KEY);
          if (!raw) return;

          try {
            const data = JSON.parse(raw);
            data.forEach((item) => {
              this.instantiateModel(item.model, item.position, item.rotation, item.scale);
            });
          } catch (e) {
            console.error('Error loading saved layout:', e);
          }
        },

        clear: function () {
          const instances = document.querySelectorAll('.persisted-instance');
          instances.forEach((el) => el.parentNode.removeChild(el));
          localStorage.removeItem(this.STORAGE_KEY);
        }
      };

      AFRAME.registerComponent('scene-persistence-manager', {
        init: function () {
          this.el.addEventListener('loaded', () => {
            ScenePersistence.load();
          });
        }
      });

      AFRAME.registerComponent('save-layout-button', {
        init: function () {
          const el = this.el;
          const statusText = document.querySelector('#menu-status');

          const triggerSave = () => {
            const count = ScenePersistence.save();
            if (statusText) {
              statusText.setAttribute('value', `Saved ${count} items!`);
              setTimeout(() => statusText.setAttribute('value', 'ASSETS'), 2000);
            }
          };

          el.addEventListener('click', triggerSave);
        }
      });

      AFRAME.registerComponent('clear-layout-button', {
        init: function () {
          const el = this.el;
          const statusText = document.querySelector('#menu-status');

          const triggerClear = () => {
            ScenePersistence.clear();
            if (statusText) {
              statusText.setAttribute('value', 'Layout cleared');
              setTimeout(() => statusText.setAttribute('value', 'ASSETS'), 2000);
            }
          };

          el.addEventListener('click', triggerClear);
        }
      });

      AFRAME.registerComponent('model-spawner', {
        schema: {
          model: { type: 'string' },
          scale: { type: 'string', default: '1 1 1' }
        },
        init: function () {
          const el = this.el;

          const spawn = () => {
            const menuParent = el.closest('#wrist-menu');
            if (menuParent && !menuParent.getAttribute('visible')) return;
            const rightHand = document.querySelector('#right-con');
            const spawnPos = new THREE.Vector3();

            if (rightHand && rightHand.object3D) {
              rightHand.object3D.getWorldPosition(spawnPos);
              const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(rightHand.object3D.quaternion);
              spawnPos.addScaledVector(dir, 0.45);
            } else {
              el.object3D.getWorldPosition(spawnPos);
              spawnPos.y += 0.2;
            }

            ScenePersistence.instantiateModel(
              this.data.model,
              `${spawnPos.x} ${spawnPos.y} ${spawnPos.z}`,
              '0 0 0',
              this.data.scale
            );
          };

          el.addEventListener('click', spawn);
        }
      });

      AFRAME.registerComponent('thumbstick-turn', {
        schema: {
          rig: { type: 'selector', default: '#rig' },
          speed: { type: 'number', default: 2.0 }
        },
        init: function () {
          this.thumbstickX = 0;
          this.el.addEventListener('axismove', (evt) => {
            this.thumbstickX = evt.detail.axis[2] !== undefined ? evt.detail.axis[2] : evt.detail.axis[0];
          });
        },
        tick: function () {
          if (Math.abs(this.thumbstickX) > 0.15) {
            const rig = this.data.rig;
            const rotation = rig.getAttribute('rotation');
            rotation.y -= this.thumbstickX * this.data.speed;
            rig.setAttribute('rotation', rotation);
          }
        }
      });

      AFRAME.registerComponent('wrist-glance-toggle', {
        schema: { threshold: { type: 'number', default: 0.1 } },
        init: function () {
          this.worldUp = new THREE.Vector3(0, 1, 0);
          this.localUp = new THREE.Vector3();
        },
        tick: function () {
          this.el.object3D.getWorldDirection(this.localUp);
          const shouldShow = this.localUp.dot(this.worldUp) > this.data.threshold;
          if (this.el.getAttribute('visible') !== shouldShow) {
            this.el.setAttribute('visible', shouldShow);
          }
        }
      });
    </script>
  </head>
  <body>
    <a-scene scene-persistence-manager renderer="antialias: true; colorManagement: true;">
      <a-entity environment="preset: default"></a-entity>

      <a-assets timeout="10000">
        <a-asset-item id="building" src="building.glb"></a-asset-item>
        <a-asset-item id="plant-glb" src="elephantplant.glb"></a-asset-item>
        <img id="thumb-plant" src="thumb_elephantplant.png">
      </a-assets>

      <a-entity id="building-model" gltf-model="#building" position="-1 -0.7 0"></a-entity>

      <!-- Player Rig -->
      <a-entity id="rig" 
                movement-controls="controls: gamepad, keyboard; speed: 0.15; fly: false" 
                position="0 0 7">
        
        <a-entity camera position="0 1.6 0" look-controls></a-entity>

        <!-- Left Controller with Hand Grab Sphere + Wrist Palette -->
        <a-entity id="left-con"
                  oculus-touch-controls="hand: left; model: true"
                  vr-grabber>
          
          <!-- Visual Hand Grab Indicator (cyan translucent sphere) -->
          <a-sphere radius="0.1" material="color: #00ffff; opacity: 0.35; wireframe: true"></a-sphere>

          <!-- Wrist Palette -->
          <a-entity id="wrist-menu"
                    position="0.08 0.06 -0.05" 
                    rotation="-50 90 -90" 
                    scale="0.4 0.4 0.4"
                    wrist-glance-toggle>

            <a-plane width="0.75" height="0.6" color="#18181b" material="opacity: 0.95; transparent: true"></a-plane>
            <a-text id="menu-status" value="ASSETS" position="0 0.23 0.01" align="center" width="1.4" color="#a1a1aa"></a-text>

            <!-- Spawner Item: Plant -->
            <a-entity position="0 0.06 0.02">
              <a-plane class="clickable" width="0.26" height="0.26" src="#thumb-plant" model-spawner="model: #plant-glb; scale: 0.8 0.8 0.8"></a-plane>
              <a-text value="Plant" position="0 -0.15 0" align="center" width="0.9" color="#fafafa"></a-text>
            </a-entity>

            <!-- Save Button -->
            <a-entity position="-0.16 -0.2 0.02">
              <a-plane class="clickable" save-layout-button width="0.28" height="0.09" color="#10b981"></a-plane>
              <a-text value="SAVE" position="0 0 0.01" align="center" width="1.2" color="#ffffff"></a-text>
            </a-entity>

            <!-- Clear Button -->
            <a-entity position="0.16 -0.2 0.02">
              <a-plane class="clickable" clear-layout-button width="0.28" height="0.09" color="#ef4444"></a-plane>
              <a-text value="CLEAR" position="0 0 0.01" align="center" width="1.2" color="#ffffff"></a-text>
            </a-entity>
          </a-entity>
        </a-entity>

        <!-- Right Controller with Laser, Hand Grab Sphere & Grabber -->
        <a-entity id="right-con"
                  oculus-touch-controls="hand: right; model: true"
                  thumbstick-turn="rig: #rig; speed: 2.0"
                  laser-controls="hand: right"
                  raycaster="objects: .clickable; far: 3"
                  vr-grabber>
          
          <!-- Visual Hand Grab Indicator (cyan translucent sphere) -->
          <a-sphere radius="0.1" material="color: #00ffff; opacity: 0.35; wireframe: true"></a-sphere>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
